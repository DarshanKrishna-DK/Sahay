# ggshield / GitGuardian config (format version 2: `version: 2` is required, paths are globs under
# secret.ignored_paths; docs.gitguardian.com/ggshield-docs/configuration).
# Only test/_env.js is ignored: it defines every fake, low-entropy test key (FAKE). Every other file,
# test files included, is scanned. Real keys live only in the git-ignored .env.
version: 2

secret:
  ignored_paths:
    - "test/_env.js"
